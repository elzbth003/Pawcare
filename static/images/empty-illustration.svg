<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <filter id="emptyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#A3B5C9" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Neumorphic Plate -->
  <rect x="25" y="20" width="150" height="120" rx="24" fill="#E6ECF4" filter="url(#emptyShadow)"/>
  
  <!-- Clinic clipboard outline -->
  <rect x="55" y="45" width="90" height="75" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="80" y="38" width="40" height="14" rx="5" fill="#94A3B8"/>

  <!-- Lines representing records -->
  <line x1="70" y1="65" x2="125" y2="65" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="80" x2="130" y2="80" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="95" x2="110" y2="95" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

  <!-- Small sleeping cat silhouette / paw beside clipboard -->
  <ellipse cx="140" cy="115" rx="16" ry="11" fill="#F59E0B"/>
  <polygon points="128,110 134,103 138,109" fill="#D97706"/>
  <polygon points="144,109 148,103 154,110" fill="#D97706"/>
  <circle cx="140" cy="115" r="3" fill="#B45309" opacity="0.4"/>
</svg>
