<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="catFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="catEarInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="softShadowCat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#F1F5F9" filter="url(#softShadowCat)"/>
  
  <!-- Pointed Ears -->
  <polygon points="26,45 32,18 48,34" fill="url(#catFur)"/>
  <polygon points="29,42 34,23 45,34" fill="url(#catEarInner)"/>

  <polygon points="74,45 68,18 52,34" fill="url(#catFur)"/>
  <polygon points="71,42 66,23 55,34" fill="url(#catEarInner)"/>

  <!-- Face -->
  <ellipse cx="50" cy="54" rx="27" ry="24" fill="url(#catFur)"/>

  <!-- Cheeks / Muzzle -->
  <ellipse cx="43" cy="62" rx="9" ry="7" fill="#F8FAFC"/>
  <ellipse cx="57" cy="62" rx="9" ry="7" fill="#F8FAFC"/>

  <!-- Nose -->
  <polygon points="48,58 52,58 50,61" fill="#FB7185"/>

  <!-- Mouth -->
  <path d="M50 61 L50 63 Q46 66 43 63 M50 63 Q54 66 57 63" stroke="#334155" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Whiskers -->
  <path d="M28 58 L40 60 M26 63 L39 63 M28 68 L40 65" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M72 58 L60 60 M74 63 L61 63 M72 68 L60 65" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Big Cat Eyes (Emerald green) -->
  <ellipse cx="38" cy="48" rx="6" ry="7" fill="#10B981"/>
  <ellipse cx="38" cy="48" rx="2" ry="5.5" fill="#0F172A"/>
  <circle cx="39.5" cy="45.5" r="1.5" fill="#FFFFFF"/>

  <ellipse cx="62" cy="48" rx="6" ry="7" fill="#10B981"/>
  <ellipse cx="62" cy="48" rx="2" ry="5.5" fill="#0F172A"/>
  <circle cx="63.5" cy="45.5" r="1.5" fill="#FFFFFF"/>
</svg>
