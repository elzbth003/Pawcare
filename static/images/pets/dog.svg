<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dogFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="dogEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Circle for Neumorphic feel -->
  <circle cx="50" cy="50" r="46" fill="#F1F5F9" filter="url(#softShadow)"/>
  
  <!-- Ears -->
  <ellipse cx="28" cy="42" rx="10" ry="18" fill="url(#dogEar)" transform="rotate(-18 28 42)"/>
  <ellipse cx="72" cy="42" rx="10" ry="18" fill="url(#dogEar)" transform="rotate(18 72 42)"/>
  
  <!-- Face/Head -->
  <ellipse cx="50" cy="52" rx="28" ry="26" fill="url(#dogFur)"/>
  
  <!-- Snout / Muzzle -->
  <ellipse cx="50" cy="62" rx="16" ry="12" fill="#FEF3C7"/>
  
  <!-- Nose -->
  <path d="M45 57 C47 55, 53 55, 55 57 C55 61, 45 61, 45 57 Z" fill="#1F2937"/>
  
  <!-- Mouth -->
  <path d="M50 59 L50 64 M45 64 Q50 68 55 64" stroke="#1F2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Tongue -->
  <path d="M48 66 Q50 72 52 66 Z" fill="#F43F5E"/>
  
  <!-- Eyes -->
  <circle cx="39" cy="48" r="4" fill="#1F2937"/>
  <circle cx="40.5" cy="46.5" r="1.3" fill="#FFFFFF"/>
  <circle cx="61" cy="48" r="4" fill="#1F2937"/>
  <circle cx="62.5" cy="46.5" r="1.3" fill="#FFFFFF"/>
  
  <!-- Eyebrows -->
  <ellipse cx="38" cy="42" rx="3" ry="1.5" fill="#D97706"/>
  <ellipse cx="62" cy="42" rx="3" ry="1.5" fill="#D97706"/>

  <!-- Collar -->
  <path d="M35 74 Q50 82 65 74" stroke="#0D9488" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="50" cy="78" r="3.5" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
</svg>
