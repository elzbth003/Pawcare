services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawcare_web
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/app/data/pawcare.db
      - FLASK_ENV=production
    volumes:
      - pawcare_db_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pawcare_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  pawcare_db_data:
    name: pawcare_db_data
